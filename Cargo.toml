[package]
name = "reviewdesk"
version = "0.1.0"
edition = "2024"
description = "Rust native desktop PR review assistant"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.34.2"
egui = "0.34.2"
egui_extras = "0.34.2"
globset = "0.4"
getrandom = "0.3"
keyring = "3.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
url = "2"
webbrowser = "1"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3"
